version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 currently breaks the typescript-eslint toolchain. The CI
      # quality gate keeps the project on the latest supported TypeScript 6.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
